<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GETIIN - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f5ed;
            color: #102b61;
            overflow-x: hidden;
        }

        .login-page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            position: relative;
            overflow: hidden;
            background: #f7f5ed;
        }

        .top-right-shape {
            position: absolute;
            top: -105px;
            right: -105px;
            width: 360px;
            height: 250px;
            background: #176ee1;
            border-radius: 0 0 0 100%;
            z-index: 1;
        }

        .top-right-shape::after {
            content: "";
            position: absolute;
            top: 18px;
            left: -5px;
            width: 285px;
            height: 205px;
            border: 2px solid #ffffff;
            border-top: none;
            border-right: none;
            border-radius: 0 0 0 100%;
        }

        .bottom-right-shape {
            position: absolute;
            right: -135px;
            bottom: -155px;
            width: 340px;
            height: 350px;
            border-radius: 50%;
            background: #176ee1;
            z-index: 1;
        }

        .bottom-right-shape::before {
            content: "";
            position: absolute;
            width: 285px;
            height: 295px;
            top: 20px;
            left: -27px;
            border: 10px solid #b9dcff;
            border-radius: 50%;
        }

        .bottom-right-shape::after {
            content: "";
            position: absolute;
            width: 245px;
            height: 255px;
            top: 40px;
            left: -7px;
            border: 2px solid #ffffff;
            border-radius: 50%;
        }

        .left-section {
            width: 44%;
            min-height: 100vh;
            position: relative;
            padding: 70px 45px 0 7%;
            z-index: 2;
            overflow: hidden;
        }

        .logo {
            width: 425px;
            max-width: 90%;
            position: relative;
            z-index: 10;
        }

        .logo img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .left-content {
            position: relative;
            z-index: 8;
            margin-top: 55px;
            max-width: 520px;
        }

        .left-content h1 {
            color: #12356f;
            font-size: clamp(38px, 3.1vw, 55px);
            line-height: 1.04;
            font-weight: 700;
            letter-spacing: -1.5px;
        }

        .left-content h1 span {
            color: #1675dd;
        }

        .blue-line {
            width: 58px;
            height: 7px;
            background: #1478df;
            border-radius: 20px;
            margin-top: 25px;
            margin-bottom: 28px;
        }

        .left-content .tagline {
            color: #536681;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.45;
            margin-bottom: 4px;
        }

        .left-content .description {
            color: #68778e;
            font-size: 17px;
            line-height: 1.55;
            max-width: 430px;
        }

        .people-image-wrapper {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 47%;
            z-index: 3;
            overflow: hidden;
        }

        .people-image {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center top;
        }

        .people-image-wrapper::after {
            content: "";
            position: absolute;
            left: -17%;
            bottom: -39%;
            width: 115%;
            height: 47%;
            background: #087cf0;
            border-radius: 50% 50% 0 0;
            transform: rotate(7deg);
            z-index: 4;
        }

        .people-image-wrapper::before {
            content: "";
            position: absolute;
            left: -12%;
            bottom: -31%;
            width: 105%;
            height: 42%;
            border: 2px solid #ffffff;
            border-radius: 50% 50% 0 0;
            transform: rotate(7deg);
            z-index: 5;
        }

        .right-section {
            width: 56%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 55px 10% 55px 30px;
            position: relative;
            z-index: 6;
        }

        .login-card {
            width: 100%;
            max-width: 635px;
            background: #ffffff;
            border-radius: 18px;
            padding: 42px 53px 57px;
            box-shadow: 0 18px 45px rgba(36, 60, 90, 0.08);
        }

        .login-logo {
            width: 250px;
            max-width: 70%;
            margin: 0 auto 35px;
        }

        .login-logo img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .login-heading {
            text-align: center;
            margin-bottom: 42px;
        }

        .login-heading h2 {
            color: #0d2f68;
            font-size: 39px;
            line-height: 1.1;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .login-heading p {
            color: #758198;
            font-size: 17px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 37px;
        }

        .form-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 11px;
        }

        .form-label {
            color: #102e67;
            font-size: 16px;
            font-weight: 700;
        }

        .forgot-password {
            color: #1767c9;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            width: 24px;
            height: 24px;
            transform: translateY(-50%);
            color: #4d6281;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            height: 60px;
            border: 1px solid #cbd2dc;
            border-radius: 10px;
            outline: none;
            background: #ffffff;
            color: #263958;
            font-size: 16px;
            padding: 0 55px;
            transition: 0.25s ease;
        }

        .input-wrapper input::placeholder {
            color: #7d899b;
        }

        .input-wrapper input:focus {
            border-color: #2879df;
            box-shadow: 0 0 0 3px rgba(40, 121, 223, 0.10);
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            color: #425777;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        .password-toggle svg {
            width: 22px;
            height: 22px;
        }

        .sign-in-button {
            width: 100%;
            height: 64px;
            border: none;
            border-radius: 10px;
            background: #2875dc;
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            transition: 0.25s ease;
        }

        .sign-in-button:hover {
            background: #1262c9;
        }

        .button-arrow {
            font-size: 27px;
            font-weight: 300;
            line-height: 1;
        }

        .or-divider {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 18px;
            margin: 47px 0 38px;
            color: #68778d;
            font-size: 14px;
        }

        .or-divider::before,
        .or-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #d3d8df;
        }

        .register-text {
            text-align: center;
            color: #64728a;
            font-size: 15px;
            line-height: 1.6;
        }

        .register-link {
            display: block;
            margin-top: 3px;
            color: #1767c9;
            font-size: 19px;
            font-weight: 700;
            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        .error-message {
            display: none;
            color: #d93025;
            font-size: 13px;
            margin-top: 8px;
        }

        @media (max-width: 1200px) {
            .left-section {
                width: 45%;
                padding-left: 6%;
            }

            .right-section {
                width: 55%;
                padding-right: 7%;
            }

            .logo {
                width: 350px;
            }

            .left-content {
                margin-top: 45px;
            }

            .left-content h1 {
                font-size: 43px;
            }

            .login-card {
                padding: 40px 42px 50px;
            }
        }

        @media (max-width: 950px) {
            .login-page {
                display: block;
                overflow: visible;
            }

            .left-section {
                width: 100%;
                min-height: 620px;
                padding: 45px 35px 310px;
            }

            .right-section {
                width: 100%;
                min-height: auto;
                padding: 35px 30px 60px;
            }

            .logo {
                width: 340px;
            }

            .left-content {
                margin-top: 45px;
            }

            .left-content h1 {
                font-size: 43px;
            }

            .people-image-wrapper {
                height: 330px;
            }

            .login-card {
                max-width: 650px;
            }

            .top-right-shape {
                z-index: 0;
            }
        }

        @media (max-width: 600px) {
            body {
                background: #f7f5ed;
            }

            .login-page {
                overflow: hidden;
            }

            .top-right-shape {
                width: 210px;
                height: 150px;
                top: -65px;
                right: -75px;
            }

            .top-right-shape::after {
                width: 160px;
                height: 120px;
                top: 12px;
                left: 0;
            }

            .bottom-right-shape {
                width: 220px;
                height: 220px;
                right: -120px;
                bottom: -120px;
            }

            .bottom-right-shape::before {
                width: 190px;
                height: 190px;
                top: 15px;
                left: -25px;
                border-width: 7px;
            }

            .bottom-right-shape::after {
                width: 160px;
                height: 160px;
                top: 30px;
                left: -7px;
            }

            .left-section {
                min-height: 555px;
                padding: 30px 22px 245px;
            }

            .logo {
                width: 240px;
                max-width: 85%;
            }

            .left-content {
                margin-top: 35px;
            }

            .left-content h1 {
                font-size: 32px;
                line-height: 1.07;
                letter-spacing: -0.8px;
            }

            .blue-line {
                width: 52px;
                height: 6px;
                margin-top: 20px;
                margin-bottom: 21px;
            }

            .left-content .tagline {
                font-size: 15px;
            }

            .left-content .description {
                font-size: 15px;
                line-height: 1.5;
                max-width: 330px;
            }

            .people-image-wrapper {
                height: 260px;
            }

            .people-image {
                object-position: center top;
            }

            .people-image-wrapper::after {
                left: -20%;
                bottom: -40%;
                width: 125%;
                height: 48%;
            }

            .people-image-wrapper::before {
                left: -14%;
                bottom: -31%;
                width: 112%;
                height: 42%;
            }

            .right-section {
                padding: 20px 16px 45px;
            }

            .login-card {
                padding: 32px 20px 40px;
                border-radius: 15px;
            }

            .login-logo {
                width: 210px;
                margin-bottom: 28px;
            }

            .login-heading {
                margin-bottom: 32px;
            }

            .login-heading h2 {
                font-size: 31px;
            }

            .login-heading p {
                font-size: 15px;
            }

            .form-group {
                margin-bottom: 27px;
            }

            .form-label {
                font-size: 14px;
            }

            .forgot-password {
                font-size: 13px;
            }

            .input-wrapper input {
                height: 54px;
                font-size: 14px;
                padding-left: 50px;
            }

            .input-icon {
                width: 21px;
                height: 21px;
                left: 16px;
            }

            .password-toggle {
                right: 13px;
            }

            .sign-in-button {
                height: 56px;
                font-size: 15px;
            }

            .or-divider {
                margin: 34px 0 28px;
            }

            .register-text {
                font-size: 13px;
            }

            .register-link {
                font-size: 17px;
            }
        }

        @media (max-width: 380px) {
            .left-section {
                min-height: 525px;
                padding-left: 18px;
                padding-right: 18px;
                padding-bottom: 230px;
            }

            .logo {
                width: 210px;
            }

            .left-content h1 {
                font-size: 29px;
            }

            .people-image-wrapper {
                height: 245px;
            }

            .login-card {
                padding-left: 17px;
                padding-right: 17px;
            }
        }
    </style>
</head>

<body>

    <main class="login-page">

        <div class="top-right-shape"></div>

        <div class="bottom-right-shape"></div>

        <section class="left-section">

            <div class="logo">
                <img
                    src="images/ei_1789659934871-removebg-preview.png"
                    alt="GETIIN - Global Ethos International Institute"
                >
            </div>

            <div class="left-content">

                <h1>
                    Building<br>
                    Better Leaders<br>
                    <span>for a Brighter Future</span>
                </h1>

                <div class="blue-line"></div>

                <p class="tagline">
                    Character. Attitude. Behaviour.
                </p>

                <p class="description">
                    Empowering young people through
                    mentorship, leadership and practical
                    growth.
                </p>

            </div>

            <div class="people-image-wrapper">
                <img
                    src="images/file_00000000ba0882309d331375c7f9c09f.png"
                    alt="Young people standing together"
                    class="people-image"
                >
            </div>

        </section>

        <section class="right-section">

            <div class="login-card">

                <div class="login-logo">
                    <img
                        src="images/ei_1789659934871-removebg-preview.png"
                        alt="GETIN"
                    >
                </div>

                <div class="login-heading">

                    <h2>Welcome Back</h2>

                    <p>
                        Sign in to continue to GETIN
                    </p>

                </div>

                <form id="loginForm">

                    <div class="form-group">

                        <div class="form-label-row">

                            <label
                                class="form-label"
                                for="email"
                            >
                                Email Address
                            </label>

                        </div>

                        <div class="input-wrapper">

                            <svg
                                class="input-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >
                                <rect
                                    x="3"
                                    y="5"
                                    width="18"
                                    height="14"
                                    rx="2"
                                ></rect>

                                <path
                                    d="M3 7l9 6 9-6"
                                ></path>
                            </svg>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email address"
                                autocomplete="email"
                                required
                            >

                        </div>

                        <p
                            class="error-message"
                            id="emailError"
                        >
                            Please enter a valid email address.
                        </p>

                    </div>

                    <div class="form-group">

                        <div class="form-label-row">

                            <label
                                class="form-label"
                                for="password"
                            >
                                Password
                            </label>

                            <a
                                href="forgot-password.html"
                                class="forgot-password"
                            >
                                Forgot password?
                            </a>

                        </div>

                        <div class="input-wrapper">

                            <svg
                                class="input-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                            >
                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="10"
                                    rx="2"
                                ></rect>

                                <path
                                    d="M8 10V7a4 4 0 0 1 8 0v3"
                                ></path>
                            </svg>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Show password"
                            >

                                <svg
                                    id="eyeIcon"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                >
                                    <path
                                        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                                    ></path>

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="2.5"
                                    ></circle>
                                </svg>

                            </button>

                        </div>

                    </div>

                    <button
                        type="submit"
                        class="sign-in-button"
                    >
                        <span> SIGN IN </span>

                        <span class="button-arrow">
                            →
                        </span>
                    </button>

                </form>

                <div class="or-divider">
                    <span>OR</span>
                </div>

                <div class="register-text">

                    <span>
                        Don't have an account?
                    </span>

                    <a
                        href="register.html"
                        class="register-link"
                    >
                        Register
                    </a>

                </div>

            </div>

        </section>

    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                togglePassword.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                passwordInput.type = "password";

                togglePassword.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        });

        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                return;
            }

            console.log("Login submitted:", {
                email: email,
                password: password
            });

        });
    </script>

</body>
</html>
