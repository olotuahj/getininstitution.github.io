
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Verification - GET IN Institution</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f7fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1b2b45;
        }

        .verification-container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .logo {
            font-size: 25px;
            font-weight: 700;
            color: #0a89f1;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .logo span {
            color: #1b2b45;
        }

        .verification-card {
            background: #ffffff;
            padding: 45px 35px;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(16, 48, 91, 0.08);
            border: 1px solid #edf1f7;
        }

        .status-icon {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: #eaf4ff;
            color: #0a89f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 0 auto 25px;
        }

        .status-icon.success {
            background: #e7f8ef;
            color: #16a34a;
        }

        .status-icon.error {
            background: #fff0f0;
            color: #dc2626;
        }

        .status-icon.warning {
            background: #fff7e6;
            color: #d97706;
        }

        .loader {
            width: 35px;
            height: 35px;
            border: 4px solid #d8eaff;
            border-top: 4px solid #0a89f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h2 {
            font-size: 23px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #142c4c;
        }

        .payment-details {
            font-size: 14px;
            line-height: 1.8;
            color: #718096;
        }

        .support-text {
            margin-top: 25px;
            font-size: 12px;
            color: #8794a7;
        }

        .support-text a {
            color: #0a89f1;
            text-decoration: none;
            font-weight: 600;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #9aa5b5;
        }

        @media (max-width: 480px) {
            .verification-card {
                padding: 40px 22px;
            }

            h2 {
                font-size: 20px;
            }

            .payment-details {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <main class="verification-container">

        <div class="logo">
            GETIN
        </div>

        <section class="verification-card">

            <div class="status-icon" id="statusIcon">
                <div class="loader"></div>
            </div>

            <h2 id="paymentMessage">Verifying your payment...</h2>

            <p class="payment-details" id="paymentDetails">
                Please wait while we confirm your transaction.
            </p>

            <p class="support-text">
                Need assistance?
                <a href="mailto:info@globalethosinitiative.com">
                    Contact Support
                </a>
            </p>

        </section>

        <div class="footer">
            &copy; 2026 Global Ethos International Institute.
            All rights reserved.
        </div>

    </main>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


        const firebaseConfig = {
            apiKey: "AIzaSyAjZAC1P1m-cErMXQhjbNz3VcHXi1sR1M8",
            authDomain: "getin-ef910.firebaseapp.com",
            projectId: "getin-ef910",
            storageBucket: "getin-ef910.firebasestorage.app",
            messagingSenderId: "458508268395",
            appId: "1:458508268395:web:cd1fef3ac1d37321e3d22e",
            measurementId: "G-R9R39FT5QE"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const message = document.getElementById("paymentMessage");
        const details = document.getElementById("paymentDetails");
        const statusIcon = document.getElementById("statusIcon");


        function updateStatus(type, title, description, icon) {

            message.textContent = title;
            details.textContent = description;

            statusIcon.className = "status-icon " + type;

            statusIcon.innerHTML = `<i class="fa-solid ${icon}"></i>`;
        }


        const reference = new URLSearchParams(window.location.search).get("reference");


        if (!reference) {

            updateStatus(
                "error",
                "Payment Reference Missing",
                "We couldn't find your payment reference. Please contact support if you were charged.",
                "fa-circle-exclamation"
            );

        } else {

            onAuthStateChanged(auth, async (user) => {

                if (!user) {

                    updateStatus(
                        "warning",
                        "Login Required",
                        "Please log in with the account used for this payment to verify your transaction.",
                        "fa-lock"
                    );

                    return;
                }


                try {

                    const idToken = await user.getIdToken();

                    const response = await fetch(
                        "https://getin-payment-api.onrender.com/api/payments/verify",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": `Bearer ${idToken}`
                            },

                            body: JSON.stringify({ reference })
                        }
                    );


                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || "Payment verification failed.");
                    }


                    updateStatus(
                        "success",
                        "Payment Successful!",
                        "Your enrolment for " + data.programName + " has been confirmed.",
                        "fa-check"
                    );


                } catch (error) {

                    updateStatus(
                        "error",
                        "Payment Verification Failed",
                        error.message,
                        "fa-xmark"
                    );

                }

            });

        }

    </script>

</body>
</html>
